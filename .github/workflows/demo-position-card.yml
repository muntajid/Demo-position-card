name: Demo Position Card

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate and generate position card
        run: |
          python src/generate_card.py

      - name: Verify output exists
        run: |
          ls -lh output/demo_position_card.png
          file output/demo_position_card.png

      - name: Upload card artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-position-card
          path: output/demo_position_card.png
          retention-days: 30
